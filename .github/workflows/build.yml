name: Build and release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use the one-time crates.io API token for the first publication
        type: boolean
        default: false
      dry_run:
        description: Authenticate and check publication without uploading
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - run: cargo fmt --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release.py check-tag "$GITHUB_REF_NAME"
      - name: Test the packaged crates.io source
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/release.py verify-package --target "$TARGET"
      - if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --release --target "$TARGET"
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo build --locked --release --target "$TARGET"
          python3 scripts/package.py --binary "target/$TARGET/release/scip-tsrs" --target "$TARGET" --tag "$GITHUB_REF_NAME"
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scip-tsrs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scip-tsrs-*
          path: dist
          merge-multiple: true
      - name: Verify and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          release_args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          GITHUB_TOKEN= gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "${release_args[@]}" ./*.tar.gz ./*.sha256

  publish-crate:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'workflow_dispatch' || vars.CRATES_IO_PUBLISH_ENABLED == 'true')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: crates-io
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: python3 scripts/release.py check-tag "$GITHUB_REF_NAME"
      - name: Check bootstrap credential
        if: inputs.bootstrap
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Add the first-publish token as CARGO_REGISTRY_TOKEN in the crates-io environment.'
            exit 1
          fi
      - name: Authenticate with crates.io trusted publishing
        if: ${{ !inputs.bootstrap }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the tested source package
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.bootstrap && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          publish_args=(--locked --no-verify --registry crates-io)
          if [ "$PUBLISH_DRY_RUN" = "true" ]; then
            publish_args+=(--dry-run)
          fi
          cargo publish "${publish_args[@]}"
