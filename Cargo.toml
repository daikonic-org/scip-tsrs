[workspace]
resolver = "3"

[package]
name = "scip-tsrs"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Native TypeScript SCIP indexer powered by tsrs"
license = "Apache-2.0"
repository = "https://github.com/daikonic-org/scip-tsrs"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
protobuf = "3"
scip = "0.10.0"
serde_json = "1"
tempfile = "3"
url = "2.5"
tsrs_ast = { git = "https://github.com/oxc-project/tsrs.git", rev = "86de03ae428a956686af29177b50f0fdf4aee059" }
tsrs_checker = { git = "https://github.com/oxc-project/tsrs.git", rev = "86de03ae428a956686af29177b50f0fdf4aee059" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs.git", rev = "86de03ae428a956686af29177b50f0fdf4aee059" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs.git", rev = "86de03ae428a956686af29177b50f0fdf4aee059" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs.git", rev = "86de03ae428a956686af29177b50f0fdf4aee059" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs.git", rev = "86de03ae428a956686af29177b50f0fdf4aee059" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs.git", rev = "86de03ae428a956686af29177b50f0fdf4aee059" }

[profile.release]
incremental = false
debug = false
lto = "off"
codegen-units = 32
