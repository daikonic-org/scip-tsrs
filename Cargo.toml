[workspace]
resolver = "3"

[package]
name = "scip-tsrs"
version = "0.2.2-alpha.1"
edition = "2024"
rust-version = "1.99"
publish = ["crates-io"]
description = "Native TypeScript SCIP indexer powered by tsrs"
license = "Apache-2.0"
repository = "https://github.com/daikonic-org/scip-tsrs"
readme = "README.md"
include = ["/src/**", "/tests/**", "/scripts/*.py", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/NOTICE-tsrs"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
protobuf = "3"
scip = "0.10.0"
serde_json = "1"
tempfile = "3"
url = "2.5"
tsrs_ast = "=0.24.0"
tsrs_checker = "=0.24.0"
tsrs_compiler = "=0.24.0"
tsrs_core = "=0.24.0"
tsrs_ls = "=0.24.0"
tsrs_scanner = "=0.24.0"
tsrs_tsoptions = "=0.24.0"
tsrs_vfs = "=0.24.0"

[profile.release]
incremental = false
debug = false
lto = "off"
codegen-units = 32
